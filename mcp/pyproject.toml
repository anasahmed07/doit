[project]
name = "mcp-service"
version = "0.1.0"
description = "DoIt MCP Service — Conversational chatbot powered by FastMCP and Gemini"
readme = "README.md"
authors = [
    { name = "Anas", email = "anasahmedshaikh.work@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "openai-agents>=0.1.0",
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
