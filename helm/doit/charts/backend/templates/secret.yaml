apiVersion: v1
kind: Secret
metadata:
  name: doit-backend-secret
  labels:
    app: doit-backend
    app.kubernetes.io/part-of: doit
type: Opaque
data:
  DATABASE_URL: {{ .Values.global.databaseUrl | default "" | b64enc | quote }}
  BETTER_AUTH_SECRET: {{ .Values.global.betterAuthSecret | default "" | b64enc | quote }}
