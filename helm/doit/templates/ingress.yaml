apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doit-ingress
  labels:
    app.kubernetes.io/part-of: doit
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: doit-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: doit-mcp
                port:
                  number: {{ .Values.mcp.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doit-frontend
                port:
                  number: {{ .Values.frontend.port }}
